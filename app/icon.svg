<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer shield body (dark background with subtle border for contrast on dark tabs) -->
  <path d="M50 6 L88 18 L88 52 C88 74 69 91 50 96 C31 91 12 74 12 52 L12 18 Z" 
        fill="#0a0b0e" 
        stroke="rgba(255,255,255,0.2)" 
        stroke-width="1.5"
        filter="url(#shadow)"/>

  <!-- Colored border strokes (GPCL signature colors) -->
  <!-- Blue (Top-Left) -->
  <path d="M50 9 L16 20 L16 52 C16 63 20 73 28 80" 
        fill="none" 
        stroke="#2563EB" 
        stroke-width="5.5" 
        stroke-linecap="round"/>

  <!-- Green (Top-Right) -->
  <path d="M50 9 L84 20 L84 52 C84 63 80 73 72 80" 
        fill="none" 
        stroke="#16A34A" 
        stroke-width="5.5" 
        stroke-linecap="round"/>

  <!-- Yellow/Gold (Bottom-Left) -->
  <path d="M28 80 C34 86 42 90 50 93" 
        fill="none" 
        stroke="#F59E0B" 
        stroke-width="5.5" 
        stroke-linecap="round"/>

  <!-- Red (Bottom-Right) -->
  <path d="M72 80 C66 86 58 90 50 93" 
        fill="none" 
        stroke="#DC2626" 
        stroke-width="5.5" 
        stroke-linecap="round"/>

  <!-- Gold Star -->
  <polygon points="50,16 52.8,23.2 60.5,23.5 54.5,28.2 56.8,35.5 50,31.2 43.2,35.5 45.5,28.2 39.5,23.5 47.2,23.2" 
           fill="#FBBF24"/>

  <!-- GPCL Bold Text -->
  <text x="50" y="63" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="900" 
        font-size="25" 
        letter-spacing="0.5">GPCL</text>
</svg>
